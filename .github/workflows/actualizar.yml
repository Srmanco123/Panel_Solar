name: Actualizar panel

on:
  schedule:
    - cron: "7 5-22 * * *"      # cada hora, ~06:07-23:07 (hora de invierno en España)
  workflow_dispatch:             # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -q -r app/requirements.txt
      - name: Generar panel cifrado
        run: python app/cloud_run.py
        env:
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          PANEL_DISPATCH_TOKEN: ${{ secrets.PANEL_DISPATCH_TOKEN }}   # opcional: botón «Actualizar ahora»
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
